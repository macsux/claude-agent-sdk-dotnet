name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['10.0.x']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET ${{ matrix.dotnet }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Unit tests only: deterministic, free, no Claude CLI required. Live-CLI
    # tests live in tests/Claude.AgentSdk.IntegrationTests and run from
    # integration.yml (they also self-skip without CLAUDE_AGENT_SDK_RUN_INTEGRATION_TESTS=1).
    - name: Unit tests
      run: dotnet test tests/Claude.AgentSdk.Tests --configuration Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory ./test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ matrix.os }}
        path: ./test-results

  aot:
    name: NativeAOT smoke test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Publishing fails on any trim/AOT warning (TreatWarningsAsErrors in the
    # smoke project); the native binary then exercises the AOT-safe surface.
    - name: Publish NativeAOT smoke app
      run: dotnet publish tests/Claude.AgentSdk.AotSmoke -c Release -r linux-x64 -o ./aot

    - name: Run NativeAOT smoke app
      run: ./aot/Claude.AgentSdk.AotSmoke

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build, aot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      run: dotnet pack src/Claude.AgentSdk/Claude.AgentSdk.csproj --configuration Release --no-build --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
